<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoolPersia</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      width: min(75vw, 480px);
      height: auto;
      transform-origin: 50% 70%;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
    }
    .logo:hover,
    .logo:active {
      transform: rotate(-6deg) scale(1.04);
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { transition: none; }
    }
  </style>
</head>
<body>
  <svg class="logo" role="img" aria-label="Cool Persia" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 202" fill="none" stroke="#722F37" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32.99 72.38 A93.5 93.5 0 1 1 29.41 114.00 A21 21 0 1 1 32.99 72.38Z"/>
    <circle cx="29" cy="93" r="8.5" fill="#722F37" stroke="none"/>
    <circle cx="212" cy="81" r="29" fill="#fff" stroke-width="11"/>
    <circle cx="212" cy="81" r="11" fill="#722F37" stroke="none"/>
    <path d="M59 68 L81 90M123 92 L157 50" stroke-width="14"/>
    <path d="M104 164 Q150 164 176 137"/>
  </svg>
</body>
</html>
